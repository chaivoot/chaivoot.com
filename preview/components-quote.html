<!doctype html><html><head><meta charset="utf-8"><title>Quote</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .quote{font-family:var(--font-serif);font-style:italic;font-size:18px;line-height:1.55;color:#111;border-left:2px solid #111;padding:4px 0 4px 18px;margin:0 0 16px}
  .thai-quote{font-family:var(--font-sans);font-style:normal;font-size:17px;font-weight:400;line-height:1.7;color:#111;border-left:2px solid #111;padding:4px 0 4px 18px;margin:0}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
</style></head><body>
<div class="label">Latin pull-quote (serif italic)</div>
<blockquote class="quote">Plant a thought today; harvest the conversation in ten years.</blockquote>
<div class="label">Thai pull-quote (sans, no italic)</div>
<blockquote class="thai-quote">รายได้ทางเดียวไม่ใช่เรื่องของคนผิด — เป็นเรื่องของคนที่ยังไม่ได้เริ่ม</blockquote>
</body></html>
