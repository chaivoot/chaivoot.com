<!doctype html><html><head><meta charset="utf-8"><title>Colors — Surface & Text</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:8px;border:1px solid var(--border)}
  .name{font-size:11px;font-weight:500;color:var(--fg)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  h4{margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted)}
  .row{margin-bottom:18px}
</style></head><body>
<div class="row">
  <h4>Surface</h4>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">bg</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#F7F6F2"></div><div class="name">bg-alt</div><div class="hex">#F7F6F2</div></div>
    <div class="sw"><div class="chip" style="background:#FBFAF7"></div><div class="name">bg-inset</div><div class="hex">#FBFAF7</div></div>
    <div class="sw"><div class="chip" style="background:#111"></div><div class="name">fg-on-dark</div><div class="hex">#111111</div></div>
  </div>
</div>
<div class="row">
  <h4>Text & Borders</h4>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#111111"></div><div class="name">fg</div><div class="hex">#111111</div></div>
    <div class="sw"><div class="chip" style="background:#6B6B6B"></div><div class="name">fg-muted</div><div class="hex">#6B6B6B</div></div>
    <div class="sw"><div class="chip" style="background:#9A9A9A"></div><div class="name">fg-faint</div><div class="hex">#9A9A9A</div></div>
    <div class="sw"><div class="chip" style="background:#E8E6E1"></div><div class="name">border</div><div class="hex">#E8E6E1</div></div>
  </div>
</div>
</body></html>
