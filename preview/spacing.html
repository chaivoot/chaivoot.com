<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .row{display:grid;grid-template-columns:60px 1fr 60px;gap:14px;align-items:center;padding:6px 0;font-size:12px}
  .bar{height:14px;background:#111;border-radius:2px}
  .tag{font-family:var(--font-mono);color:var(--fg-faint)}
  .px{font-family:var(--font-mono);color:var(--fg-muted);text-align:right}
</style></head><body>
<div class="row"><div class="tag">--s-1</div><div><div class="bar" style="width:4px"></div></div><div class="px">4px</div></div>
<div class="row"><div class="tag">--s-2</div><div><div class="bar" style="width:8px"></div></div><div class="px">8px</div></div>
<div class="row"><div class="tag">--s-3</div><div><div class="bar" style="width:12px"></div></div><div class="px">12px</div></div>
<div class="row"><div class="tag">--s-4</div><div><div class="bar" style="width:16px"></div></div><div class="px">16px</div></div>
<div class="row"><div class="tag">--s-5</div><div><div class="bar" style="width:24px"></div></div><div class="px">24px</div></div>
<div class="row"><div class="tag">--s-6</div><div><div class="bar" style="width:32px"></div></div><div class="px">32px</div></div>
<div class="row"><div class="tag">--s-7</div><div><div class="bar" style="width:48px"></div></div><div class="px">48px</div></div>
<div class="row"><div class="tag">--s-8</div><div><div class="bar" style="width:64px"></div></div><div class="px">64px</div></div>
<div class="row"><div class="tag">--s-9</div><div><div class="bar" style="width:96px"></div></div><div class="px">96px</div></div>
</body></html>
