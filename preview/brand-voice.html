<!doctype html><html><head><meta charset="utf-8"><title>Voice & Tone</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  .col{padding:14px;border:1px solid var(--border);border-radius:8px;font-size:13px;line-height:1.7}
  .col.no{border-color:#E8C5BF;background:#FBF3F1;color:#7A2520}
  .col.yes{border-color:#C8E6D7;background:#F1F9F4;color:#15805E}
  .label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;opacity:.7}
</style></head><body>
<div class="row">
  <div class="col no"><div class="label">No</div>คุณรู้หรือไม่ว่าโอกาสพิเศษวันนี้เท่านั้น!</div>
  <div class="col yes"><div class="label">Yes</div>เช้านี้ผมคิดเรื่องนี้อยู่ — แชร์ไว้เผื่อคุณเจอแบบเดียวกัน</div>
</div>
<div class="row">
  <div class="col no"><div class="label">No · Title Case</div>โภชนาการหมา: ทำไมผมเลือก BARF</div>
  <div class="col yes"><div class="label">Yes · sentence case</div>โภชนาการหมา: ทำไมผมเลือก BARF ให้มอมแมม</div>
</div>
<div class="row">
  <div class="col no"><div class="label">No · "เรา"</div>เราเชื่อว่าคุณจะรักผลิตภัณฑ์นี้</div>
  <div class="col yes"><div class="label">Yes · "ผม"</div>ผมใช้เองทุกวัน เลยอยากเล่าให้ฟัง</div>
</div>
</body></html>
