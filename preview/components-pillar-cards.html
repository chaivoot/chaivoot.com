<!doctype html><html><head><meta charset="utf-8"><title>Pillar Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{position:relative;border:1px solid #E8E6E1;border-radius:12px;padding:24px 20px;background:#fff;overflow:hidden}
  .stripe{position:absolute;top:0;left:0;right:0;height:2px}
  .num{font-family:var(--font-mono);font-size:11px;color:#9A9A9A;margin-bottom:18px}
  .name{font-size:16px;font-weight:500;margin-bottom:6px}
  .desc{font-size:13px;line-height:1.7;color:#6B6B6B}
  .more{font-size:12px;margin-top:14px;display:inline-block;color:#111;text-decoration:underline;text-decoration-thickness:1px}
</style></head><body>
<div class="grid">
  <div class="card"><div class="stripe" style="background:#5E5C82"></div>
    <div class="num">01</div><div class="name">ธุรกิจ Amway</div>
    <div class="desc">โอกาส มุมมอง และคนที่ผมเจอระหว่างทาง</div>
    <div class="more">อ่านบันทึก →</div></div>
  <div class="card"><div class="stripe" style="background:#647C66"></div>
    <div class="num">02</div><div class="name">Longevity</div>
    <div class="desc">Nutrition, lifestyle, mindset เพื่อชีวิตที่มีคุณภาพ</div>
    <div class="more">อ่านบันทึก →</div></div>
  <div class="card"><div class="stripe" style="background:#9F6147"></div>
    <div class="num">03</div><div class="name">หมาและมอมแมม</div>
    <div class="desc">Choice-based training และโภชนาการหมา</div>
    <div class="more">อ่านบันทึก →</div></div>
</div>
</body></html>
