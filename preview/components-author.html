<!doctype html><html><head><meta charset="utf-8"><title>Author Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .card{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:18px;border:1px solid #E8E6E1;border-radius:12px;background:#FBFAF7}
  .ava{width:64px;height:64px;border-radius:999px;object-fit:cover;display:block;background:#E8E6E1}
  .name{font-size:15px;font-weight:500}
  .bio{font-size:13px;line-height:1.7;color:#6B6B6B;margin-top:2px}
  .cta{font-size:13px;font-weight:500;padding:8px 14px;border-radius:12px;background:#06C755;color:#fff;text-decoration:none}
</style></head><body>
<div class="card">
  <img class="ava" src="../assets/photos/chaivoot-avatar.png" alt="ชัยวุฒิ" />
  <div>
    <div class="name">ชัยวุฒิ</div>
    <div class="bio">บันทึกของผู้ชายวัย 50 — ธุรกิจ longevity และมอมแมม</div>
  </div>
  <a class="cta">LINE</a>
</div>
</body></html>
