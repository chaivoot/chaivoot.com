<!doctype html><html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px;line-height:1.4}
  .dot{width:6px;height:6px;border-radius:50%}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);min-width:90px}
</style></head><body>
<div class="row"><span class="label">บันทึกสั้น</span>
  <span class="badge" style="background:#ECEAFB;color:#3F379A">บันทึก</span>
  <span class="badge" style="background:#E2F4EC;color:#15805E">บันทึก</span>
  <span class="badge" style="background:#FBE9DF;color:#B14724">บันทึก</span>
</div>
<div class="row"><span class="label">บทความ</span>
  <span class="badge" style="background:#F0EDE7;color:#6B6B6B">บทความ</span>
</div>
<div class="row"><span class="label">Pillar dot</span>
  <span class="badge" style="background:transparent;color:#6B6B6B"><span class="dot" style="background:#534AB7"></span>Amway</span>
  <span class="badge" style="background:transparent;color:#6B6B6B"><span class="dot" style="background:#1D9E75"></span>Longevity</span>
  <span class="badge" style="background:transparent;color:#6B6B6B"><span class="dot" style="background:#D85A30"></span>หมา</span>
</div>
</body></html>
