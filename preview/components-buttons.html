<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:14px;font-weight:500;padding:10px 18px;border-radius:12px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:all 200ms}
  .btn-primary{background:#111;color:#fff}
  .btn-outline{background:#fff;color:#111;border-color:#111}
  .btn-ghost{background:transparent;color:#111;padding:10px 4px}
  .btn-ghost:hover{text-decoration:underline}
  .btn-line{background:#06C755;color:#fff}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);min-width:80px}
</style></head><body>
<div class="row"><span class="label">Primary</span>
  <a class="btn btn-primary">คุยกันทาง LINE</a>
  <a class="btn btn-outline">ทำความรู้จัก</a>
  <a class="btn btn-ghost">อ่านต่อ →</a>
</div>
<div class="row"><span class="label">External</span>
  <a class="btn btn-outline">dogevityfood.com ↗</a>
  <a class="btn btn-line">LINE ↗</a>
</div>
<p style="margin-top:14px;font-size:12px;color:var(--fg-muted);line-height:1.6">No shadows, no gradients. Outline buttons fill on hover. External links carry a ↗ glyph.</p>
</body></html>
