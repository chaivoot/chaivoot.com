<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:64px;height:64px;background:var(--bg-alt);border:1px solid var(--border)}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);text-align:center}
  .name{font-size:11px;color:var(--fg);font-weight:500}
</style></head><body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="name">posts</div><div class="tag">0</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">badge</div><div class="tag">4px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">image</div><div class="tag">8px</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">input</div><div class="tag">10px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">button / card</div><div class="tag">12px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">filter pill</div><div class="tag">999px</div></div>
</div>
<p style="margin-top:24px;font-size:12px;color:var(--fg-muted);line-height:1.6">No shadows. Borders use 1px hairlines (~ 0.5px effective via transform on hr's). Flat throughout.</p>
</body></html>
