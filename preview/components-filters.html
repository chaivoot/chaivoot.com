<!doctype html><html><head><meta charset="utf-8"><title>Filter Pills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:400;padding:6px 14px;border-radius:999px;border:1px solid #E8E6E1;background:#fff;color:#6B6B6B;cursor:pointer}
  .pill.on{background:#111;color:#fff;border-color:#111}
  .dot{width:6px;height:6px;border-radius:50%}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em}
</style></head><body>
<div class="label">Filter (active = solid black)</div>
<div class="pills">
  <span class="pill on">ทั้งหมด</span>
  <span class="pill"><span class="dot" style="background:#534AB7"></span>Amway</span>
  <span class="pill"><span class="dot" style="background:#1D9E75"></span>Longevity</span>
  <span class="pill"><span class="dot" style="background:#D85A30"></span>หมา</span>
</div>
</body></html>
