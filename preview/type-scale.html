<!doctype html><html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--fg)}
  .row{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border-faint)}
  .row:first-child{border-top:none}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-faint)}
  .ex{color:var(--fg)}
</style></head><body>
<div class="row"><div class="tag">H1 / 30</div><div class="ex" style="font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.3">บันทึกของผู้ชายวัย 50</div></div>
<div class="row"><div class="tag">H2 / 22</div><div class="ex" style="font-size:22px;font-weight:500;line-height:1.35">โภชนาการหมา: ทำไมผมเลือก BARF</div></div>
<div class="row"><div class="tag">H3 / 18</div><div class="ex" style="font-size:18px;font-weight:500">ทำสิ่งที่ social media ทำไม่ได้</div></div>
<div class="row"><div class="tag">Body / 16</div><div class="ex" style="font-size:16px;line-height:1.75">เขียนสิ่งที่คิด สิ่งที่ทำ สิ่งที่อยากจำไว้ — บางวันสั้น บางวันยาว</div></div>
<div class="row"><div class="tag">Small / 13</div><div class="ex" style="font-size:13px;color:#6B6B6B">บางวันสั้น บางวันยาว ไม่มีตารางบังคับ</div></div>
<div class="row"><div class="tag">Meta / 12</div><div class="ex" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6B6B6B">5 ก.พ. 2026 · อ่าน 4 นาที</div></div>
</body></html>
